name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, format, translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run i18n:check

  test:
    name: Unit, service and integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://audit:audit@localhost:5432/audit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test

  migrations:
    name: Migrations match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Generated SQL is committed
        working-directory: packages/db
        run: |
          bunx --bun drizzle-kit check
          bunx --bun drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "The schema changed without a committed migration:"
            git status --porcelain drizzle
            exit 1
          fi

  supply-chain:
    name: Licences and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run licenses
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: --lockfile=bun.lock

  image:
    name: Container image and end-to-end tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: audit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bunx --bun playwright install --with-deps chromium
        working-directory: apps/web
      - name: End-to-end tests against the image
        run: bun run e2e
        env:
          E2E_IMAGE: audit:ci
