# Local development database. Start with `bun run db:up`.
name: audit-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
